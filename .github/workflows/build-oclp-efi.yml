name: Build OCLP EFI for V720-14 (Sequoia)

on:
  workflow_dispatch:

jobs:
  build-efi:
    name: Build OpenCore Legacy Patcher EFI
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download OCLP latest release
        run: |
          mkdir -p oclp
          cd oclp
          LATEST=$(curl -s https://api.github.com/repos/dortania/OpenCore-Legacy-Patcher/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Latest OCLP version: $LATEST"
          curl -L -o OCLP.zip "https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/${LATEST}/OpenCore-Patcher.zip"
          unzip -q OCLP.zip
          ls -la

      - name: Install OCLP dependencies
        run: |
          cd oclp/OpenCore-Patcher
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build EFI for MacBookPro14,1 (Sequoia 15.x)
        run: |
          cd oclp/OpenCore-Patcher
          python3 build_open_core.py \
            --model MacBookPro14,1 \
            --version 15.0 \
            --output ./EFI \
            --no-gui

      - name: Verify EFI structure
        run: |
          cd oclp/OpenCore-Patcher
          echo "=== EFI 目录结构 ==="
          find EFI -type f | head -30
          echo ""
          echo "=== 关键文件检查 ==="
          test -f EFI/OC/config.plist && echo "✅ config.plist 存在" || echo "❌ config.plist 缺失"
          test -f EFI/OC/OpenCore.efi && echo "✅ OpenCore.efi 存在" || echo "❌ OpenCore.efi 缺失"
          test -d EFI/OC/Kexts && echo "✅ Kexts 目录存在" || echo "❌ Kexts 目录缺失"
          test -d EFI/OC/ACPI && echo "✅ ACPI 目录存在" || echo "❌ ACPI 目录缺失"
          test -d EFI/OC/Drivers && echo "✅ Drivers 目录存在" || echo "❌ Drivers 目录缺失"
          if grep -q "<key>Patch</key>" EFI/OC/config.plist; then
            PATCH_COUNT=$(grep -A 100 "<key>Patch</key>" EFI/OC/config.plist | grep -c "<dict>")
            echo "✅ Kernel -> Patch 存在 ($PATCH_COUNT 个补丁条目)"
          else
            echo "❌ Kernel -> Patch 缺失"
          fi

      - name: Upload EFI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-V720-14-Sequoia
          path: oclp/OpenCore-Patcher/EFI/
          retention-days: 7

      - name: Summary
        run: |
          echo "## 🎉 OCLP EFI 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **机型**: MacBookPro14,1 (Kaby Lake i7-7500U)" >> $GITHUB_STEP_SUMMARY
          echo "- **目标系统**: macOS 15 Sequoia" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`OCLP-EFI-V720-14-Sequoia\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 下一步" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载 Artifact 解压得到 \`EFI\` 文件夹" >> $GITHUB_STEP_SUMMARY
          echo "2. 编译并放入 5 个 SSDT (.aml) 到 \`EFI/OC/ACPI/\`" >> $GITHUB_STEP_SUMMARY
          echo "3. 用 ProperTree 合并关键配置 (IGPU 注入、声卡 layout-id、三码等)" >> $GITHUB_STEP_SUMMARY
          echo "4. 填入自己生成的三码 (MLB, SystemSerialNumber, SystemUUID)" >> $GITHUB_STEP_SUMMARY
          echo "5. 制作安装盘, 复制 EFI 到 U 盘 EFI 分区" >> $GITHUB_STEP_SUMMARY
          echo "6. 安装后**必须**进 U 盘跑 OCLP Root Patch" >> $GITHUB_STEP_SUMMARY
          echo "7. 进系统后用 USBToolBox 导出 USBMap.kext 替换 USBInjectAll" >> $GITHUB_STEP_SUMMARY
