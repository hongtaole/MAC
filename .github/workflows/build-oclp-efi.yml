name: Build OCLP EFI for V720-14 (Sequoia)

on:
  workflow_dispatch:

jobs:
  build-efi:
    name: Build OpenCore Legacy Patcher EFI
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download OCLP release asset (try all zip assets)
        run: |
          set -euo pipefail
          mkdir -p oclp
          cd oclp

          echo "=== Fetching all zip assets from latest release ==="

          # 用 jq 获取所有 .zip asset 的下载 URL 数组
          ASSET_URLS=$(curl -sL -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/dortania/OpenCore-Legacy-Patcher/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' 2>/dev/null)

          if [[ -z "$ASSET_URLS" ]]; then
            echo "ERROR: No zip assets found in latest release"
            exit 1
          fi

          echo "Found zip assets:"
          echo "$ASSET_URLS"

          # 逐个尝试下载，直到成功
          DOWNLOAD_OK=false
          while IFS= read -r URL; do
            [[ -z "$URL" ]] && continue
            echo "Trying: $URL"
            for i in 1 2 3; do
              echo "  Attempt $i/3..."
              if curl -fL --retry 2 --retry-delay 5 -o OCLP.zip "$URL"; then
                SIZE=$(stat -c%s OCLP.zip 2>/dev/null || stat -f%z OCLP.zip)
                if [[ $SIZE -gt 1000000 ]]; then
                  echo "  Download OK ($SIZE bytes)"
                  DOWNLOAD_OK=true
                  break 2
                else
                  echo "  File too small ($SIZE bytes), retrying..."
                  rm -f OCLP.zip
                fi
              else
                echo "  curl failed, retrying..."
              fi
              sleep 5
            done
          done <<< "$ASSET_URLS"

          if [[ "$DOWNLOAD_OK" != "true" ]]; then
            echo "All assets failed to download"
            exit 1
          fi

          if ! unzip -t OCLP.zip >/dev/null 2>&1; then
            echo "Zip integrity check failed"
            exit 1
          fi

          unzip -q OCLP.zip
          ls -la

      - name: Install OCLP dependencies
        run: |
          cd oclp/OpenCore-Patcher
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build EFI for MacBookPro14,1 (Sequoia 15.x)
        run: |
          cd oclp/OpenCore-Patcher
          python3 build_open_core.py --help || true
          python3 build_open_core.py \
            --model MacBookPro14,1 \
            --version 15.0 \
            --output ./EFI \
            --no-gui

      - name: Verify EFI structure
        run: |
          cd oclp/OpenCore-Patcher
          echo "=== EFI directory structure ==="
          find EFI -type f | head -30
          echo ""
          echo "=== Key files check ==="
          test -f EFI/OC/config.plist && echo "config.plist OK" || echo "config.plist MISSING"
          test -f EFI/OC/OpenCore.efi && echo "OpenCore.efi OK" || echo "OpenCore.efi MISSING"
          test -d EFI/OC/Kexts && echo "Kexts dir OK" || echo "Kexts dir MISSING"
          test -d EFI/OC/ACPI && echo "ACPI dir OK" || echo "ACPI dir MISSING"
          test -d EFI/OC/Drivers && echo "Drivers dir OK" || echo "Drivers dir MISSING"
          if grep -q "<key>Patch</key>" EFI/OC/config.plist; then
            PATCH_COUNT=$(grep -A 100 "<key>Patch</key>" EFI/OC/config.plist | grep -c "<dict>")
            echo "Kernel -> Patch OK ($PATCH_COUNT entries)"
          else
            echo "Kernel -> Patch MISSING"
          fi

      - name: Upload EFI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-V720-14-Sequoia
          path: oclp/OpenCore-Patcher/EFI/
          retention-days: 7

      - name: Summary
        run: |
          echo "## OCLP EFI Build Complete" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- Model: MacBookPro14,1 (Kaby Lake i7-7500U)" >> $env:GITHUB_STEP_SUMMARY
          echo "- Target: macOS 15 Sequoia" >> $env:GITHUB_STEP_SUMMARY
          echo "- Artifact: OCLP-EFI-V720-14-Sequoia" >> $env:GITHUB_STEP_SUMMARY
