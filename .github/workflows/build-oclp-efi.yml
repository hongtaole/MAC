name: Build OCLP EFI for V720-14 (Sequoia)

on:
  workflow_dispatch:

jobs:
  build-efi:
    name: Build OpenCore Legacy Patcher EFI
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and install OCLP pkg
        run: |
          set -euo pipefail
          mkdir -p oclp
          cd oclp

          echo "=== Fetching OCLP pkg asset ==="

          # 硬编码兜底 URL（2.5.1 版本）
          FALLBACK_URL="https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg"

          # 尝试从 API 获取（带重试）
          PKG_URL=""
          for i in 1 2 3; do
            echo "Fetching pkg URL attempt $i/3..."
            API_RESPONSE=$(curl -sL -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/dortania/OpenCore-Legacy-Patcher/releases/latest 2>/dev/null)
            
            if [[ -n "$API_RESPONSE" && "$API_RESPONSE" != "null" ]]; then
              PKG_URL=$(echo "$API_RESPONSE" | jq -r '.assets[] | select(.name | test("OpenCore-Patcher\\.pkg$")) | .browser_download_url' | head -1 2>/dev/null)
              [[ -n "$PKG_URL" && "$PKG_URL" != "null" ]] && break
            fi
            echo "  API failed or returned null, retrying..."
            sleep 5
          done

          if [[ -z "$PKG_URL" || "$PKG_URL" == "null" ]]; then
            echo "WARNING: API failed after retries, using hardcoded fallback URL"
            PKG_URL="$FALLBACK_URL"
          fi

          echo "Downloading: $PKG_URL"
          curl -fL -o OpenCore-Patcher.pkg "$PKG_URL"

          echo "Installing pkg..."
          sudo installer -pkg OpenCore-Patcher.pkg -target /

      - name: Find OCLP Python module and build EFI
        run: |
          set -euo pipefail
          cd oclp

          echo "=== Locating OCLP Python module ==="

          OCLP_APP=$(find /Applications -name "OpenCore-Patcher.app" -maxdepth 2 2>/dev/null | head -1)
          if [[ -z "$OCLP_APP" ]]; then
            OCLP_APP=$(find / -name "OpenCore-Patcher.app" -maxdepth 4 2>/dev/null | head -1)
          fi

          if [[ -z "$OCLP_APP" ]]; then
            echo "ERROR: OpenCore-Patcher.app not found"
            exit 1
          fi

          echo "Found app at: $OCLP_APP"

          OCLP_MODULE=$(find "$OCLP_APP" -name "open_core_patcher" -type d 2>/dev/null | head -1)
          if [[ -z "$OCLP_MODULE" ]]; then
            OCLP_MODULE=$(find "$OCLP_APP" -name "*.py" -path "*/open_core_patcher/*" 2>/dev/null | head -1 | xargs dirname)
          fi

          if [[ -z "$OCLP_MODULE" ]]; then
            echo "ERROR: open_core_patcher module not found in app bundle"
            find "$OCLP_APP" -name "*.py" | head -20
            exit 1
          fi

          MODULE_DIR=$(dirname "$OCLP_MODULE")
          echo "Found module at: $MODULE_DIR"

          export PYTHONPATH="$MODULE_DIR:$PYTHONPATH"

          echo "=== Building EFI for MacBookPro14,1 (Sequoia 15.x) ==="
          python3 -m open_core_patcher \
            --model MacBookPro14,1 \
            --version 15.0 \
            --output ./EFI \
            --no-gui

          # 验证生成的 EFI
          echo "=== EFI directory structure ==="
          find EFI -type f | head -30
          echo ""
          echo "=== Key files check ==="
          test -f EFI/OC/config.plist && echo "config.plist OK" || echo "config.plist MISSING"
          test -f EFI/OC/OpenCore.efi && echo "OpenCore.efi OK" || echo "OpenCore.efi MISSING"
          test -d EFI/OC/Kexts && echo "Kexts dir OK" || echo "Kexts dir MISSING"
          test -d EFI/OC/ACPI && echo "ACPI dir OK" || echo "ACPI dir MISSING"
          test -d EFI/OC/Drivers && echo "Drivers dir OK" || echo "Drivers dir MISSING"
          if grep -q "<key>Patch</key>" EFI/OC/config.plist; then
            PATCH_COUNT=$(grep -A 100 "<key>Patch</key>" EFI/OC/config.plist | grep -c "<dict>")
            echo "Kernel -> Patch OK ($PATCH_COUNT entries)"
          else
            echo "Kernel -> Patch MISSING"
          fi

      - name: Upload EFI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-V720-14-Sequoia
          path: oclp/EFI/
          retention-days: 7

      - name: Summary
        run: |
          echo "## OCLP EFI Build Complete" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- Model: MacBookPro14,1 (Kaby Lake i7-7500U)" >> $env:GITHUB_STEP_SUMMARY
          echo "- Target: macOS 15 Sequoia" >> $env:GITHUB_STEP_SUMMARY
          echo "- Artifact: OCLP-EFI-V720-14-Sequoia" >> $env:GITHUB_STEP_SUMMARY
