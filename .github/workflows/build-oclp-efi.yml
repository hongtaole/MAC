name: Build OCLP EFI for V720-14 (Sequoia)

on:
  workflow_dispatch:

jobs:
  build-efi:
    name: Build OpenCore Legacy Patcher EFI
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and install OCLP pkg
        run: |
          set -euo pipefail
          mkdir -p oclp
          cd oclp

          PKG_URL="https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg"
          echo "Downloading: $PKG_URL"
          curl -fL -o OpenCore-Patcher.pkg "$PKG_URL"
          sudo installer -pkg OpenCore-Patcher.pkg -target /

      - name: Find OCLP module and build EFI
        run: |
          set -euo pipefail
          cd oclp

          echo "=== Locating OCLP Python module ==="

          OCLP_APP=$(find /Applications -name "OpenCore-Patcher.app" -maxdepth 2 2>/dev/null | head -1)
          if [[ -z "$OCLP_APP" ]]; then
            OCLP_APP=$(find / -name "OpenCore-Patcher.app" -maxdepth 4 2>/dev/null | head -1)
          fi

          if [[ -z "$OCLP_APP" ]]; then
            echo "ERROR: OpenCore-Patcher.app not found"
            exit 1
          fi

          echo "Found app at: $OCLP_APP"
          echo "=== App bundle Python files ==="
          find "$OCLP_APP" -name "*.py" | head -30

          # 尝试多种可能的模块名/路径
          MODULE_DIR=""
          for pattern in "open_core_patcher" "open_core" "OpenCorePatcher" "open_core_patcher.py" "OpenCorePatcher.py"; do
            MODULE_DIR=$(find "$OCLP_APP" -name "$pattern" -type d 2>/dev/null | head -1)
            [[ -n "$MODULE_DIR" ]] && break
            MODULE_DIR=$(find "$OCLP_APP" -name "$pattern" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null)
            [[ -n "$MODULE_DIR" ]] && break
          done

          if [[ -z "$MODULE_DIR" ]]; then
            echo "ERROR: OCLP Python module not found"
            find "$OCLP_APP" -name "*.py" | head -30
            exit 1
          fi

          # 如果找到的是文件，取其目录
          if [[ -f "$MODULE_DIR" ]]; then
            MODULE_DIR=$(dirname "$MODULE_DIR")
          fi

          echo "Found module dir: $MODULE_DIR"
          export PYTHONPATH="$MODULE_DIR:$PYTHONPATH"

          echo "=== Building EFI for MacBookPro14,1 (Sequoia 15.x) ==="
          python3 -m open_core_patcher \
            --model MacBookPro14,1 \
            --version 15.0 \
            --output ./EFI \
            --no-gui

          # 验证生成的 EFI
          echo "=== EFI directory structure ==="
          find EFI -type f | head -30
          echo ""
          echo "=== Key files check ==="
          test -f EFI/OC/config.plist && echo "config.plist OK" || echo "config.plist MISSING"
          test -f EFI/OC/OpenCore.efi && echo "OpenCore.efi OK" || echo "OpenCore.efi MISSING"
          test -d EFI/OC/Kexts && echo "Kexts dir OK" || echo "Kexts dir MISSING"
          test -d EFI/OC/ACPI && echo "ACPI dir OK" || echo "ACPI dir MISSING"
          test -d EFI/OC/Drivers && echo "Drivers dir OK" || echo "Drivers dir MISSING"
          if grep -q "<key>Patch</key>" EFI/OC/config.plist; then
            PATCH_COUNT=$(grep -A 100 "<key>Patch</key>" EFI/OC/config.plist | grep -c "<dict>")
            echo "Kernel -> Patch OK ($PATCH_COUNT entries)"
          else
            echo "Kernel -> Patch MISSING"
          fi

      - name: Upload EFI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-V720-14-Sequoia
          path: oclp/EFI/
          retention-days: 7

      - name: Summary
        run: |
          echo "## OCLP EFI Build Complete" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- Model: MacBookPro14,1 (Kaby Lake i7-7500U)" >> $env:GITHUB_STEP_SUMMARY
          echo "- Target: macOS 15 Sequoia" >> $env:GITHUB_STEP_SUMMARY
          echo "- Artifact: OCLP-EFI-V720-14-Sequoia" >> $env:GITHUB_STEP_SUMMARY
