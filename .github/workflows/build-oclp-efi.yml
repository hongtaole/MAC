name: Build OCLP EFI for V720-14 (Sequoia)

on:
  workflow_dispatch:

jobs:
  build-efi:
    name: Build OpenCore Legacy Patcher EFI
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and install OCLP pkg
        run: |
          set -euo pipefail
          mkdir -p oclp
          cd oclp

          PKG_URL="https://github.com/dortania/OpenCore-Legacy-Patcher/releases/download/2.5.1/OpenCore-Patcher.pkg"
          echo "Downloading: $PKG_URL"
          curl -fL -o OpenCore-Patcher.pkg "$PKG_URL"
          sudo installer -pkg OpenCore-Patcher.pkg -target /

      - name: Build EFI using OCLP CLI
        run: |
          set -euo pipefail
          cd oclp

          echo "=== Checking OCLP CLI availability ==="

          OCLP_CLI="/Applications/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher"
          if [[ ! -x "$OCLP_CLI" ]]; then
            echo "ERROR: CLI not found at $OCLP_CLI"
            exit 1
          fi

          echo "Found CLI at: $OCLP_CLI"

          echo "=== Building EFI for MacBookPro14,1 (Sequoia 15.x) ==="
          BUILD_OUTPUT=$("$OCLP_CLI" \
            --build \
            --model MacBookPro14,1 \
            --disk ./EFI \
            --disable_sip \
            --verbose 2>&1)

          echo "$BUILD_OUTPUT"

          # 从输出中提取构建路径
          BUILD_DIR=$(echo "$BUILD_OUTPUT" | grep -oE "/var/folders/[^ ]+/Build-Folder/OpenCore-Build" | head -1)

          if [[ -z "$BUILD_DIR" ]]; then
            BUILD_DIR=$(echo "$BUILD_OUTPUT" | grep -oE "/var/folders/[^ ]+/Build-Folder/[^ ]+" | head -1)
          fi

          if [[ -z "$BUILD_DIR" ]]; then
            echo "ERROR: Could not extract build directory from output"
            exit 1
          fi

          echo "Found build dir from output: $BUILD_DIR"

          # 直接用 find 定位实际的 EFI 文件（不依赖目录是否存在，不因 find 失败退出）
          echo "=== Searching for actual EFI files ==="
          EFI_FILES=$(find /var/folders -path "*/Build-Folder/OpenCore-Build/*" -type f 2>/dev/null | head -20 || true)
          
          if [[ -z "$EFI_FILES" ]]; then
            echo "Trying broader search..."
            EFI_FILES=$(find /var/folders -path "*/Build-Folder/*OpenCore*Build*/*" -type f 2>/dev/null | head -20 || true)
          fi

          if [[ -z "$EFI_FILES" ]]; then
            echo "Trying even broader search..."
            EFI_FILES=$(find /var/folders -name "OpenCore-Build" -type d 2>/dev/null -exec find {} -type f \; 2>/dev/null | head -20 || true)
          fi

          if [[ -z "$EFI_FILES" ]]; then
            echo "ERROR: No EFI files found"
            find /var/folders -name "*OpenCore*Build*" -type f 2>/dev/null | head -20
            exit 1
          fi

          echo "Found EFI files:"
          echo "$EFI_FILES"

          # 确定源目录（取第一个文件的目录）
          SRC_DIR=$(dirname $(echo "$EFI_FILES" | head -1))
          echo "Source directory: $SRC_DIR"

          # 复制到 ./EFI
          mkdir -p ./EFI
          cp -R "$SRC_DIR"/* ./EFI/

          # 验证生成的 EFI
          echo "=== EFI directory structure ==="
          find EFI -type f | head -30
          echo ""
          echo "=== Key files check ==="
          test -f EFI/OC/config.plist && echo "config.plist OK" || echo "config.plist MISSING"
          test -f EFI/OC/OpenCore.efi && echo "OpenCore.efi OK" || echo "OpenCore.efi MISSING"
          test -d EFI/OC/Kexts && echo "Kexts dir OK" || echo "Kexts dir MISSING"
          test -d EFI/OC/ACPI && echo "ACPI dir OK" || echo "ACPI dir MISSING"
          test -d EFI/OC/Drivers && echo "Drivers dir OK" || echo "Drivers dir MISSING"
          if grep -q "<key>Patch</key>" EFI/OC/config.plist; then
            PATCH_COUNT=$(grep -A 100 "<key>Patch</key>" EFI/OC/config.plist | grep -c "<dict>")
            echo "Kernel -> Patch OK ($PATCH_COUNT entries)"
          else
            echo "Kernel -> Patch MISSING"
          fi

      - name: Upload EFI as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-V720-14-Sequoia
          path: oclp/EFI/
          retention-days: 7

      - name: Summary
        run: |
          echo "## OCLP EFI Build Complete" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- Model: MacBookPro14,1 (Kaby Lake i7-7500U)" >> $env:GITHUB_STEP_SUMMARY
          echo "- Target: macOS 15 Sequoia" >> $env:GITHUB_STEP_SUMMARY
          echo "- Artifact: OCLP-EFI-V720-14-Sequoia" >> $env:GITHUB_STEP_SUMMARY
